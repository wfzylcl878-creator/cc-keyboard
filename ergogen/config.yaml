# CC-Keyboard — 6 键蓝牙小键盘（4 方向 + 回车 + ESC）
# 布局：两行紧凑十字（↓ 与 ←→ 同行），ESC 在 ↑ 左侧，
#       回车 1u 宽 × 2u 高（竖跨两行）
# 主控：SuperMini nRF52840（排针插接，可拆卸）
# 生成：npx ergogen ergogen/config.yaml -o output

meta:
  author: cc-keyboard
  version: v1.0.0

units:
  u: 19.05     # Cherry MX 标准键距
  mm: 1
  edge: 7.5    # PCB 边框外扩（mm）

points:
  zones:
    matrix:
      anchor:
        rotate: 0
      # 稀疏列结构（十字布局）：
      #   x=-1: ESC(上) ←(下)   x=0: ↑(上) ↓(下)
      #   x=+1: →(下)           x=+2: 回车（中心在两行之间）
      # 注意：列内 rows 不能删行（zone 行全保留），须用 skip: true
      columns:
        esc:
          rows:
            top: {}
            bottom: {}
        nav:
          rows:
            top: {}
            bottom: {}
        right:
          rows:
            top: {skip: true}
            bottom: {}
        enter:
          rows:
            top: {skip: true}
            # 上移半行 → 中心落在两行之间（1u 宽 × 2u 高竖键）
            bottom: {shift: [0, 0.5u]}
      # 行按声明顺序自 y=0 向上堆叠——bottom 必须写在前
      rows:
        bottom: {}
        top: {}

outlines:
  # 定位板（plate）：外形与 PCB 同（键阵外扩 edge），再挖 14mm 轴孔
  plate:
    - what: rectangle
      where: true
      size: 1u
      bound: true
      expand: edge
    - what: rectangle
      where: true
      size: [14, 14]
      operation: subtract
  # PCB 边框：键阵外扩 edge 毫米 + 底部凸出区（SuperMini/电池/开关）
  board:
    - what: rectangle
      where: true
      size: 1u
      bound: true
      expand: edge
    - what: rectangle
      where: "/^matrix_nav_bottom$/"
      adjust: {shift: [9.525mm, -24.65mm]}
      size: [91.19mm, 20mm]

pcbs:
  main:
    outlines:
      board: {outline: board}
    footprints:
      # —— 6 个 MX 热插拔轴位（挂到对应键位上）——
      mx_esc:
        what: mx
        where: "/^matrix_esc_top$/"
        params: {from: GND, to: KEY_ESC, hotswap: true}
      mx_left:
        what: mx
        where: "/^matrix_esc_bottom$/"
        params: {from: GND, to: KEY_LEFT, hotswap: true}
      mx_up:
        what: mx
        where: "/^matrix_nav_top$/"
        params: {from: GND, to: KEY_UP, hotswap: true}
      mx_down:
        what: mx
        where: "/^matrix_nav_bottom$/"
        params: {from: GND, to: KEY_DOWN, hotswap: true}
      mx_right:
        what: mx
        where: "/^matrix_right_bottom$/"
        params: {from: GND, to: KEY_RIGHT, hotswap: true}
      mx_enter:
        what: mx
        where: "/^matrix_enter_bottom$/"
        params: {from: GND, to: KEY_ENTER, hotswap: true}
      # —— SuperMini nRF52840 排母座（横放在底部凸出区，USB 朝左）——
      # 孔位按实物（13×2 孔、排距 15.24、孔距 2.54，与 kriscables/nice!nano_v2 pinout 一致）：
      #   行A(上排, USB端起): B- P0.06 P0.08 GND GND P0.17 P0.20 P0.22 P0.24 P1.00 ...
      #   行B(下排, USB端起第1孔): B+
      # 行B只放 1 孔 → 插反 180° 对不上，天然防呆。
      # pad 生成后经后处理脚本转为 1.0mm 通孔（排母用）。
      mcu_bneg:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [-5.715mm, -16.38mm]}
        params: {net: BAT_MINUS, width: 1.8, height: 1.8, text: "B-"}
      mcu_esc:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [-3.175mm, -16.38mm]}
        params: {net: KEY_ESC, width: 1.8, height: 1.8, text: "1"}
      mcu_up:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [-0.635mm, -16.38mm]}
        params: {net: KEY_UP, width: 1.8, height: 1.8, text: "2"}
      mcu_gnd:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [1.905mm, -16.38mm]}
        params: {net: GND, width: 1.8, height: 1.8, text: "G"}
      mcu_left:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [6.985mm, -16.38mm]}
        params: {net: KEY_LEFT, width: 1.8, height: 1.8, text: "3"}
      mcu_down:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [9.525mm, -16.38mm]}
        params: {net: KEY_DOWN, width: 1.8, height: 1.8, text: "4"}
      mcu_right:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [12.065mm, -16.38mm]}
        params: {net: KEY_RIGHT, width: 1.8, height: 1.8, text: "5"}
      mcu_enter:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [14.605mm, -16.38mm]}
        params: {net: KEY_ENTER, width: 1.8, height: 1.8, text: "6"}
      mcu_bpos:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [-5.715mm, -31.62mm]}
        # 开关出线（BAT_SWITCHED）：电池+ → 开关 → 此孔 → SuperMini B+
        params: {net: BAT_SWITCHED, width: 1.8, height: 1.8, text: "B+"}
      # SuperMini 板身丝印角标（33×17.78mm 区域四角）
      mcu_corner_tl:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [-6.975mm, -15.11mm]}
        params: {net: "", width: 0.8, height: 0.8, text: "USB <"}
      mcu_corner_br:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [26.025mm, -32.89mm]}
        params: {net: "", width: 0.8, height: 0.8, text: ""}

      # —— 电池：JST PH 2.0 插座（凸出区左段）——
      battery:
        what: jstph
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [-25.05mm, -24mm], rotate: 180}
        params: {pos: BAT_PLUS, neg: BAT_MINUS}

      # —— 电源拨动开关焊盘（凸出区右段；不装开关时锡桥短接）——
      sw_common:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [29.45mm, -24mm]}
        params: {net: BAT_PLUS, width: 2.2, height: 2.2, text: "SW IN"}
      sw_throw:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [32.45mm, -24mm]}
        params: {net: BAT_SWITCHED, width: 2.2, height: 2.2, text: "SW OUT"}

      # —— 丝印 ——
      title:
        what: pad
        where: "/^matrix_nav_bottom$/"
        adjust: {shift: [38.95mm, -30mm]}
        params: {net: "", width: 0.01, height: 0.01, text: "CC-Keyboard v1.1"}

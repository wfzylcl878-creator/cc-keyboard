# west manifest（ZMK 官方 workflow 要求：config_path 本身含 west.yml，
# 且为仓库根下的一级目录，workspace 顶目录才会落在仓库根）
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    path: zmk-config
